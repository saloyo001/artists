<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Kenyan Artisans</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth-style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <form class="auth-form" id="signup-form">
      <a class="auth-brand" href="index.html">Kenyan <strong>Artisans</strong></a>
      <h1>Create an account</h1>
      <p>Join the Kenyan Artisans community.</p>

      <label for="name">Your name</label>
      <input type="text" id="name" name="name" autocomplete="name" maxlength="80" required>

      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="password">Create a password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
      <small>Use at least 6 characters for this demo.</small>

      <button type="submit">Create account</button>
      <p class="auth-message" id="signup-message" aria-live="polite"></p>

      <p>Already have an account? <a href="login.html">Log in</a></p>
      <a href="index.html">Back to the marketplace</a>
    </form>
  </main>
</body>
</html>
