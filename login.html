<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Kenyan Artisans</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth-style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js" defer></script>
</head>
<body class="auth-page-body">
  <main class="auth-page">
    <form class="auth-form" id="login-form">
      <a class="auth-brand" href="index.html">Kenyan <strong>Artisans</strong></a>
      <button type="button" id="auth-theme-toggle">Dark mode</button>
      <h1>Welcome back</h1>
      <p>Sign in to your Kenyan Artisans account.</p>

      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <label class="show-password-label">
  <input type="checkbox" id="show-password">
  Show password
</label>

      <button type="submit">Log in</button>
      <p class="auth-message" id="login-message" aria-live="polite"></p>

      <p>Don't have an account? <a href="signup.html">Sign up</a></p>
      <a href="index.html">Back to the marketplace</a>
    </form>
  </main>
  
   <script>
const savedTheme = localStorage.getItem("kenyanArtisansTheme");

if (savedTheme === "dark") {
  document.body.classList.add("dark-mode");
}
const themeButton = document.getElementById("auth-theme-toggle");

function updateThemeButton() {
  const isDark = document.body.classList.contains("dark-mode");
  themeButton.textContent = isDark ? " Light mode" : " Dark mode";
}

themeButton.addEventListener("click", function () {
  const isDark = document.body.classList.toggle("dark-mode");
  const theme = isDark ? "dark" : "light";

  document.documentElement.dataset.theme = theme;
  localStorage.setItem("kenyanArtisansTheme", theme);

  updateThemeButton();
});

updateThemeButton();
  const passwordInput = document.getElementById("password");
  const showPassword = document.getElementById("show-password");

  showPassword.addEventListener("change", function () {
    passwordInput.type = showPassword.checked ? "text" : "password";
  });
</script>
</body>
</html>
