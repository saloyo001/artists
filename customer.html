
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard | Kenyan Artisans</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .customer-dashboard {
      max-width: 1000px;
      margin: 50px auto;
      padding: 24px;
    }

    .dashboard-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin: 24px 0;
    }

    .dashboard-card {
      padding: 24px;
      border-radius: 12px;
      background: #f5f1eb;
    }

    .dashboard-card h3 {
      margin-top: 0;
    }

    .order-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
      margin: 16px 0;
    }

    .order-item {
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    #dashboard-message {
      margin: 20px 0;
    }

    @media (max-width: 600px) {
      .dashboard-summary {
        grid-template-columns: 1fr;
      }

      .customer-dashboard {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-mark">KA</span>
      <span>Kenyan <strong>Artisans</strong></span>
    </a>

    <nav class="nav-links">
      <a href="index.html">Back to shop</a>
      
    </nav>
  </header>

  <main class="customer-dashboard">
    <h1>My Dashboard</h1>
    <p>View your purchases and track your orders.</p>

    <div class="dashboard-summary">
      <section class="dashboard-card">
        <h3>Total orders</h3>
        <p id="total-orders">0</p>
      </section>

      <section class="dashboard-card">
        <h3>Total paid</h3>
        <p id="total-spent">KSh 0.00</p>
      </section>
    </div>

    <h2>My purchases</h2>

    <p id="dashboard-message">Loading your orders...</p>

    <section id="orders-list"></section>
  </main>

 

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="customer.js"></script>

</body>
</html>
