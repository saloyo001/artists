<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Kenyan Artisans</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth-style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="auth.js"></script>
</head>
<body>
    <main class="auth-page">
        <form class="auth-form" id="forgot-password-form">
            <a class="auth-brand" href="index.html">
                Kenyan <strong>Artisans</strong>
            </a>

            <h1>Reset your password</h1>

            <p>
                Enter the email address associated with your account.
                We'll send you a password reset link.
            </p>

            <label for="forgot-email">Email address</label>
            <input
                type="email"
                id="forgot-email"
                name="email"
                autocomplete="email"
                required
            >

            <button type="submit">Send reset link</button>

            <p
                class="auth-message"
                id="forgot-password-message"
                aria-live="polite"
            ></p>

            <p>
                Remember your password?
                <a href="login.html">Log in</a>
            </p>

            <a href="index.html">Back to the marketplace</a>
        </form>
    </main>
</body>
</html>
