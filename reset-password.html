<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a New Password | Kenyan Artisans</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth-style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="auth.js"></script>
</head>
<body>
    <main class="auth-page">
        <form class="auth-form" id="reset-password-form">
            <a class="auth-brand" href="index.html">
                Kenyan <strong>Artisans</strong>
            </a>

            <h1>Choose a new password</h1>
            <p>Choose a password you haven't used on another account.</p>

            <label for="new-password">New password</label>
            <input
                type="password"
                id="new-password"
                name="password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <label for="confirm-password">Confirm new password</label>
            <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <button type="submit">Update password</button>

            <p
                class="auth-message"
                id="reset-password-message"
                aria-live="polite"
            ></p>

            <a href="login.html">Back to login</a>
        </form>
    </main>
</body>
</html>
