<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | Kenyan Artisans</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth-style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    #reset-password-form[hidden] {
      display: none !important;
    }

    .show-password-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0 16px;
    }

    .show-password-label input {
      width: auto;
    }
  </style>
</head>

<body>
  <main class="auth-page">
    <form class="auth-form" id="reset-password-form" hidden>
      <a class="auth-brand" href="index.html">
        Kenyan <strong>Artisans</strong>
      </a>

      <h1>Reset your password</h1>
      <p>Choose a new password for your account.</p>

      <label for="new-password">New password</label>
      <input
        type="password"
        id="new-password"
        name="new-password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <label class="show-password-label">
        <input type="checkbox" id="show-new-password">
        Show password
      </label>

      <label for="confirm-password">Confirm new password</label>
      <input
        type="password"
        id="confirm-password"
        name="confirm-password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <label class="show-password-label">
        <input type="checkbox" id="show-confirm-password">
        Show confirmation password
      </label>

      <button type="submit" id="reset-submit">
        Update password
      </button>

      <p class="auth-message" id="reset-message" aria-live="polite"></p>
    </form>

    <div class="auth-form">
      <p class="auth-message" id="reset-status" aria-live="polite">
        Checking your password-reset link...
      </p>

      <a href="login.html">Back to login</a>
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://dpkttivsoqfoumahieqx.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_lRBZmxGIQ_MdH371SSVwGg_xvCGeSyq";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("reset-password-form");
    const status = document.getElementById("reset-status");
    const message = document.getElementById("reset-message");
    const submitButton = document.getElementById("reset-submit");

    const newPassword = document.getElementById("new-password");
    const confirmPassword = document.getElementById("confirm-password");

    const queryParams = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(
      window.location.hash.substring(1)
    );

    const hasRecoveryLink =
      queryParams.has("code") ||
      hashParams.get("type") === "recovery";

    const authError =
      queryParams.get("error_description") ||
      hashParams.get("error_description");

    let recoveryReady = false;

    function enableResetForm() {
      recoveryReady = true;
      form.hidden = false;
      status.textContent = "";
    }

    if (authError) {
      status.textContent =
        "Your reset link could not be verified. Please request a new link.";
    } else {
      client.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" && session) {
          enableResetForm();
        }
      });

      async function checkRecoverySession() {
        try {
          const { data, error } = await client.auth.getSession();

          if (error) {
            throw error;
          }

          if (data.session && hasRecoveryLink) {
            enableResetForm();
          } else if (!recoveryReady) {
            status.textContent =
              "This reset link is invalid or expired. Please request a new password-reset email and open it in the same browser where you started the request.";
          }
        } catch (error) {
          status.textContent =
            error.message ||
            "Could not verify the reset link. Please request a new one.";
        }
      }

      checkRecoverySession();
    }

    document
      .getElementById("show-new-password")
      .addEventListener("change", function () {
        newPassword.type = this.checked ? "text" : "password";
      });

    document
      .getElementById("show-confirm-password")
      .addEventListener("change", function () {
        confirmPassword.type = this.checked ? "text" : "password";
      });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!recoveryReady) {
        message.textContent =
          "Please open a valid password-reset link from your email.";
        return;
      }

      if (newPassword.value !== confirmPassword.value) {
        message.textContent = "The passwords do not match.";
        confirmPassword.focus();
        return;
      }

      if (newPassword.value.length < 6) {
        message.textContent =
          "Your password must contain at least 6 characters.";
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Updating password...";
      message.textContent = "";

      try {
        const { error } = await client.auth.updateUser({
          password: newPassword.value
        });

        if (error) {
          throw error;
        }

        message.textContent =
          "Password updated successfully! Redirecting to login...";

        form.reset();
        form.hidden = true;
        status.textContent =
          "Your password has been changed successfully.";

        window.setTimeout(async function () {
          try {
            await client.auth.signOut();
          } catch (error) {
            console.error("Sign-out notice:", error);
          }

          window.location.href = "login.html";
        }, 1500);

      } catch (error) {
        message.textContent =
          error.message || "Could not update your password.";

        submitButton.disabled = false;
        submitButton.textContent = "Update password";
      }
    });
  </script>
</body>
</html>
